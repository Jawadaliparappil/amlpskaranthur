<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Environment Day Poster Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary: linear-gradient(135deg, #10b981, #059669); 
      --secondary: linear-gradient(135deg, #34d399, #059669);
      --bg-gradient: linear-gradient(-45deg, #064e3b, #0f766e, #047857, #064e3b);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      color: var(--text-main);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 550px;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #6ee7b7, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .instructions {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .file-input-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .file-input-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed #6ee7b7;
      padding: 35px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .file-input-label:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .file-input-label svg {
      color: #6ee7b7;
      width: 36px;
      height: 36px;
    }

    input[type="file"] {
      position: absolute;
      left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
    }

    .button {
      background: var(--primary);
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.25);
      width: 100%;
    }

    .button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .canvas-container {
      margin: 20px 0;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border);
      width: 100%;
    }

    #posterCanvas {
      width: 100%;
      height: auto;
      display: block;
    }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(2, 44, 34, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 15px;
    }

    .modal.active {
      opacity: 1; pointer-events: auto;
    }

    .modal-content {
      background: #064e3b;
      border: 1px solid var(--glass-border);
      padding: 30px 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal.active .modal-content {
      transform: scale(1);
    }

    .modal h2 {
      margin-top: 0;
      font-size: 1.5rem;
      background: linear-gradient(135deg, #a7f3d0, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal input {
      width: 100%;
      padding: 14px;
      margin: 20px 0;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      outline: none;
      text-align: center;
      text-transform: uppercase; 
    }

    .modal input:focus {
      border-color: #6ee7b7;
      box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.25);
    }

    #cropModal .modal-content {
      max-width: 600px;
      padding: 20px 15px;
      background: #022c22;
    }

    .crop-wrapper {
      max-height: 55vh;
      margin-bottom: 20px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #cropImage {
      max-width: 100%;
      display: block;
    }

    .cropper-view-box, .cropper-face {
      border-radius: 50%;
    }

    #uploadSection, #resultSection {
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px 15px;
        border-radius: 18px;
      }
      .header h1 { font-size: 1.8rem; }
      .instructions { font-size: 0.85rem; }
      .modal-content { padding: 25px 20px; }
      .modal h2 { font-size: 1.3rem; }
      .button { padding: 12px 20px; font-size: 0.95rem; }
      .file-input-label { padding: 25px 15px; }
    }
  </style>
</head>
<body>

  <div id="nameModal" class="modal active">
    <div class="modal-content">
      <h2>Welcome!</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">Enter your name to start generating your Environment Day poster.</p>
      <input type="text" id="nameInput" placeholder="Enter Your Name Here" autocomplete="off"/>
      <button class="button" onclick="submitName()">Continue</button>
    </div>
  </div>

  <div class="container" style="display: none;" id="mainContainer">
    <div class="header">
      <h1>AMLPS Karanthur</h1>
    </div>

    <div id="uploadSection">
      <div class="instructions">
        Step 2: Upload a clear photo to place inside the circular frame.
      </div>
      <div class="file-input-wrapper">
        <div class="file-input-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <span>Tap here to Choose Photo</span>
        </div>
        <input type="file" id="photoInput" accept="image/*" />
      </div>
    </div>

    <div id="resultSection" style="display: none;">
      <div class="instructions" style="color: #6ee7b7;">
        Success! Here is your generated poster.
      </div>
      <div class="canvas-container">
        <canvas id="posterCanvas"></canvas>
      </div>
      <button class="button" id="downloadBtn" onclick="downloadPoster()">Download Poster</button>
      <button class="button" style="background: transparent; border: 1px solid var(--glass-border); margin-top: 10px; box-shadow: none;" onclick="location.reload()">Create Another</button>
    </div>
  </div>

  <div id="cropModal" class="modal">
    <div class="modal-content">
      <h2 style="background: linear-gradient(135deg, #6ee7b7, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; font-size: 1.2rem;">Adjust Alignment</h2>
      <div class="crop-wrapper">
        <img id="cropImage" src="" alt="Crop preview" />
      </div>
      <button class="button" style="background: var(--secondary); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);" onclick="applyCrop()">Apply & Generate</button>
    </div>
  </div>

  <script src="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.js"></script>
  <script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('photoInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const cropModal = document.getElementById('cropModal');
    const nameModal = document.getElementById('nameModal');
    const cropImage = document.getElementById('cropImage');
    const mainContainer = document.getElementById('mainContainer');
    
    const uploadSection = document.getElementById('uploadSection');
    const resultSection = document.getElementById('resultSection');

    let frameArea = { centerX: 0, centerY: 0, radius: 0 };
    
    const background = new Image();
    background.src = 'evs1.jpg';

    let backgroundLoaded = false;
    let cropper;
    let croppedImage = null;
    let userName = '';

    background.onload = () => {
      canvas.width = background.width;
      canvas.height = background.height;
      
      frameArea.centerX = canvas.width * 0.35;  
      frameArea.centerY = canvas.height * 0.45; 
      frameArea.radius = canvas.width * 0.200;  

      backgroundLoaded = true;
    };

    background.onerror = () => {
      console.error("Error loading poster background.");
    };

    function submitName() {
      const nameInput = document.getElementById('nameInput').value.trim();
      if (!nameInput) {
        alert("Please enter your name to continue.");
        return;
      }
      userName = nameInput.toUpperCase();
      nameModal.classList.remove('active');
      mainContainer.style.display = 'block';
    }

    input.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      
      if (!backgroundLoaded) {
        alert("Error: The background image could not be found. Please make sure 'evs1.jpg' is in the exact same folder.");
        return;
      }

      const reader = new FileReader();
      reader.onload = event => {
        cropImage.src = event.target.result;
        cropModal.classList.add('active');

        if (cropper) cropper.destroy();

        cropper = new Cropper(cropImage, {
          aspectRatio: 1, 
          viewMode: 1,
          movable: true,
          zoomable: true,
          scalable: false,
          cropBoxResizable: true,
          responsive: true,
          autoCropArea: 1
        });
      };
      reader.readAsDataURL(file);
    });

    function applyCrop() {
      const canvasCrop = cropper.getCroppedCanvas({ 
        width: frameArea.radius * 2, 
        height: frameArea.radius * 2 
      });
      
      croppedImage = new Image();
      croppedImage.onload = () => {
        drawCanvas();
        cropModal.classList.remove('active');
        uploadSection.style.display = 'none';
        resultSection.style.display = 'block';
      };
      croppedImage.src = canvasCrop.toDataURL('image/png');
    }

    // Helper function to wrap text into multiple lines
    function getLines(ctx, text, maxWidth) {
      const words = text.split(" ");
      const lines = [];
      let currentLine = words[0];

      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = ctx.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (backgroundLoaded) ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
      
      if (croppedImage) {
        ctx.save(); 
        
        ctx.beginPath();
        ctx.arc(frameArea.centerX, frameArea.centerY, frameArea.radius, 0, Math.PI * 2, true);
        ctx.closePath();
        
        ctx.clip(); 
        
        ctx.drawImage(
          croppedImage, 
          frameArea.centerX - frameArea.radius, 
          frameArea.centerY - frameArea.radius, 
          frameArea.radius * 2, 
          frameArea.radius * 2
        );
        
        ctx.restore(); 
        
        if (userName) {
          const fontSize = Math.max(20, Math.floor(canvas.width * 0.032)); 
          ctx.font = `bold ${fontSize}px Poppins`;
          
          // Layout Constraints
          const gapFromCircle = 15; // Space between the photo circle and the text box
          const paddingX = 20; // Inside left/right padding for white box
          const paddingY = 16; // Inside top/bottom padding for white box
          const rightMargin = 40; // Prevent box from touching the right edge of the poster

          // Calculate available max width for text
          const circleRightEdge = frameArea.centerX + frameArea.radius;
          const maxBoxWidth = canvas.width - circleRightEdge - gapFromCircle - rightMargin;
          const maxTextWidth = maxBoxWidth - (paddingX * 2);

          // Get properly wrapped lines
          const lines = getLines(ctx, userName, maxTextWidth);

          // Find the actual widest line to fit the box snugly
          let maxLineWidth = 0;
          lines.forEach(line => {
              const w = ctx.measureText(line).width;
              if (w > maxLineWidth) maxLineWidth = w;
          });

          // Calculate White Box dimensions
          const lineHeight = fontSize * 1.3;
          const bgWidth = maxLineWidth + (paddingX * 2);
          const bgHeight = (lines.length * lineHeight) + (paddingY * 2) - (lineHeight - fontSize); 
          
          // Position the White Box directly to the right of the circle
          const bgX = circleRightEdge + gapFromCircle; 
          
          // Vertically align relative to the previous anchor point
          const targetY = frameArea.centerY + (frameArea.radius * 0.45);
          const bgY = targetY - (bgHeight / 2);
          
          // Draw the White Background Box
          ctx.fillStyle = "#ffffff"; 
          ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
          ctx.shadowBlur = 8;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 4;
          
          ctx.beginPath();
          if(ctx.roundRect) {
            ctx.roundRect(bgX, bgY, bgWidth, bgHeight, 12);
          } else {
            ctx.rect(bgX, bgY, bgWidth, bgHeight);
          }
          ctx.fill();
          
          // Reset shadow so the text itself doesn't have one
          ctx.shadowColor = "transparent"; 
          
          // Draw the User's Name Line by Line
          ctx.fillStyle = "#064e3b"; 
          ctx.textAlign = "left"; // Align left relative to the new box
          ctx.textBaseline = "top";
          
          let textY = bgY + paddingY;
          lines.forEach(line => {
              ctx.fillText(line, bgX + paddingX, textY);
              textY += lineHeight;
          });
        }
      }
    }

    function downloadPoster() {
      canvas.toBlob(function(blob) {
        if (!blob) {
          alert("Failed to prepare image for download.");
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'environment_day_karanthur.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 'image/png', 1.0);
    }
  </script>
</body>
</html>
